# OpenTelemetry Collector configuration for RetinalAI.
#
# Receives OTLP traces and metrics from the FastAPI application,
# exports traces to Jaeger and metrics to Prometheus.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

  # Add resource attributes for all telemetry
  resource:
    attributes:
      - key: service.namespace
        value: retinalai
        action: upsert

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Traces -> Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics -> Prometheus scrape endpoint
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: retinalai
    resource_to_telemetry_conversion:
      enabled: true

  # Debug logging (disable in production)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

# RetinalAI 2026 Backend Configuration Reference
# All environment variables organized by phase.
# Use env_nested_delimiter="__" (e.g., TELEMETRY__ENABLED=true)

# ── Phase 1: Observability & MLOps ──

telemetry:
  enabled: false                    # TELEMETRY__ENABLED
  otlp_endpoint: "http://localhost:4317"  # TELEMETRY__OTLP_ENDPOINT
  otlp_protocol: "grpc"            # TELEMETRY__OTLP_PROTOCOL (grpc|http)
  service_name: "retinalai"        # TELEMETRY__SERVICE_NAME
  sample_rate: 1.0                 # TELEMETRY__SAMPLE_RATE
  log_correlation: true            # TELEMETRY__LOG_CORRELATION
  metrics_export_interval_ms: 60000  # TELEMETRY__METRICS_EXPORT_INTERVAL_MS

mlflow:
  enabled: false                   # MLFLOW__ENABLED
  tracking_uri: "http://localhost:5000"  # MLFLOW__TRACKING_URI
  registry_uri: ""                 # MLFLOW__REGISTRY_URI
  model_name: "retinalai-vignn"    # MLFLOW__MODEL_NAME
  experiment_name: "retinalai-production"  # MLFLOW__EXPERIMENT_NAME
  promotion_min_f1: 0.0            # MLFLOW__PROMOTION_MIN_F1
  promotion_min_auc: 0.0           # MLFLOW__PROMOTION_MIN_AUC

active_learning_loop:
  enabled: false                   # ACTIVE_LEARNING_LOOP__ENABLED
  retrain_threshold: 150           # ACTIVE_LEARNING_LOOP__RETRAIN_THRESHOLD
  queue_dir: "data/active_learning"  # ACTIVE_LEARNING_LOOP__QUEUE_DIR
  lora_rank: 16                    # ACTIVE_LEARNING_LOOP__LORA_RANK
  lora_alpha: 16.0                 # ACTIVE_LEARNING_LOOP__LORA_ALPHA
  retention_ratio: 0.3             # ACTIVE_LEARNING_LOOP__RETENTION_RATIO
  finetune_epochs: 5               # ACTIVE_LEARNING_LOOP__FINETUNE_EPOCHS
  finetune_lr: 0.0001              # ACTIVE_LEARNING_LOOP__FINETUNE_LR
  confidence_threshold: 0.65       # ACTIVE_LEARNING_LOOP__CONFIDENCE_THRESHOLD

drift:
  enabled: true                    # DRIFT__ENABLED
  psi_threshold: 0.2               # DRIFT__PSI_THRESHOLD
  ks_threshold: 0.05               # DRIFT__KS_THRESHOLD
  confidence_drop_threshold: 0.1   # DRIFT__CONFIDENCE_DROP_THRESHOLD
  window_size: 200                 # DRIFT__WINDOW_SIZE
  check_interval: 100              # DRIFT__CHECK_INTERVAL
  nannyml_enabled: false           # DRIFT__NANNYML_ENABLED
  evidently_enabled: false         # DRIFT__EVIDENTLY_ENABLED
  alert_webhook_url: ""            # DRIFT__ALERT_WEBHOOK_URL

# ── Phase 2: Scalability & Security ──

ray:
  enabled: false                   # RAY__ENABLED
  serve_url: "http://localhost:8000"  # RAY__SERVE_URL
  timeout_s: 30.0                  # RAY__TIMEOUT_S
  batch_max_size: 16               # RAY__BATCH_MAX_SIZE
  batch_timeout_s: 0.1             # RAY__BATCH_TIMEOUT_S
  min_replicas: 1                  # RAY__MIN_REPLICAS
  max_replicas: 8                  # RAY__MAX_REPLICAS
  target_ongoing_requests: 10      # RAY__TARGET_ONGOING_REQUESTS

canary:
  enabled: false                   # CANARY__ENABLED
  primary_version: "default"       # CANARY__PRIMARY_VERSION
  canary_version: ""               # CANARY__CANARY_VERSION
  canary_weight: 0.0               # CANARY__CANARY_WEIGHT
  sticky_sessions: true            # CANARY__STICKY_SESSIONS

circuit_breaker:
  failure_threshold: 5             # CIRCUIT_BREAKER__FAILURE_THRESHOLD
  recovery_timeout_s: 60.0         # CIRCUIT_BREAKER__RECOVERY_TIMEOUT_S
  half_open_max_calls: 3           # CIRCUIT_BREAKER__HALF_OPEN_MAX_CALLS

mtls:
  enabled: false                   # MTLS__ENABLED
  ca_cert_path: ""                 # MTLS__CA_CERT_PATH
  client_cert_path: ""             # MTLS__CLIENT_CERT_PATH
  client_key_path: ""              # MTLS__CLIENT_KEY_PATH
  verify_hostname: true            # MTLS__VERIFY_HOSTNAME

kafka:
  enabled: false                   # KAFKA__ENABLED
  bootstrap_servers: "localhost:9092"  # KAFKA__BOOTSTRAP_SERVERS
  audit_topic: "retinalai.audit"   # KAFKA__AUDIT_TOPIC
  events_topic: "retinalai.events"  # KAFKA__EVENTS_TOPIC
  security_protocol: "PLAINTEXT"   # KAFKA__SECURITY_PROTOCOL
  acks: "all"                      # KAFKA__ACKS

iceberg:
  enabled: false                   # ICEBERG__ENABLED
  catalog_uri: ""                  # ICEBERG__CATALOG_URI
  warehouse: ""                    # ICEBERG__WAREHOUSE
  table_name: "retinalai.audit_events"  # ICEBERG__TABLE_NAME

# ── Phase 3: Governance & Edge ──

edge:
  onnx_enabled: false              # EDGE__ONNX_ENABLED
  onnx_model_path: "models/export/model.onnx"  # EDGE__ONNX_MODEL_PATH
  coreml_enabled: false            # EDGE__COREML_ENABLED
  coreml_model_path: "models/export/model.mlpackage"  # EDGE__COREML_MODEL_PATH
  quantized_enabled: false         # EDGE__QUANTIZED_ENABLED
  quantized_model_path: "models/export/model_int8.pth"  # EDGE__QUANTIZED_MODEL_PATH
  parity_tolerance: 0.0001         # EDGE__PARITY_TOLERANCE

fairness:
  enabled: false                   # FAIRNESS__ENABLED
  cache_ttl_s: 3600                # FAIRNESS__CACHE_TTL_S
  protected_attributes:            # FAIRNESS__PROTECTED_ATTRIBUTES
    - age_group
    - sex
    - ethnicity
    - camera_device
    - geography

model_card:
  auto_generate: false             # MODEL_CARD__AUTO_GENERATE
  output_dir: "outputs/governance"  # MODEL_CARD__OUTPUT_DIR

# ── Phase 4: Future-Proofing ──

resilience:
  enabled: false                   # RESILIENCE__ENABLED
  health_check_interval_s: 30.0    # RESILIENCE__HEALTH_CHECK_INTERVAL_S
  fallback_cache_ttl_s: 300        # RESILIENCE__FALLBACK_CACHE_TTL_S

multimodal:
  enabled: false                   # MULTIMODAL__ENABLED
  modalities: ["fundus"]           # MULTIMODAL__MODALITIES
  fusion_strategy: "concatenation"  # MULTIMODAL__FUSION_STRATEGY

federated:
  enabled: false                   # FEDERATED__ENABLED
  framework: "flower"              # FEDERATED__FRAMEWORK
  server_address: "localhost:8080"  # FEDERATED__SERVER_ADDRESS
  local_epochs: 3                  # FEDERATED__LOCAL_EPOCHS
  dp_enabled: false                # FEDERATED__DP_ENABLED
  dp_epsilon: 10.0                 # FEDERATED__DP_EPSILON

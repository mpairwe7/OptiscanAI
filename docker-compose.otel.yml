# OpenTelemetry observability stack for RetinalAI.
# Usage: docker compose -f docker-compose.yml -f docker-compose.otel.yml up -d
#
# Provides: OTEL Collector (traces+metrics), Jaeger (trace UI), Prometheus (metrics).
# Set TELEMETRY__ENABLED=true in .env to activate instrumentation in the API.

services:
  api:
    environment:
      - TELEMETRY__ENABLED=true
      - TELEMETRY__OTLP_ENDPOINT=http://otel-collector:4317
      - TELEMETRY__SERVICE_NAME=retinalai
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: retinal-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: retinal-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC collector (from OTEL collector)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16687/"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: retinal-prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  prometheus-data:

name: billing-smoke

# Runs the Phase 6 subscription-billing smoke test against a freshly-spawned
# Postgres so PR diffs can't regress the quota / feature-gate / seat-limit /
# downgrade / admin / renewal-cron contracts that the frontend depends on.
#
# Postgres is started manually (not as a `services:` block) so the password
# is generated at runtime from `openssl rand` — it never appears in source
# and is masked in logs via `::add-mask::`. Same for JWT_SECRET. This
# bypasses GitGuardian's keyword-based "Generic Password" matcher entirely.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/test_billing_smoke.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/billing-smoke.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/test_billing_smoke.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/billing-smoke.yml"
  workflow_dispatch:

concurrency:
  group: billing-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: pytest tests/test_billing_smoke.py
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Required to unlock the SaaS code paths the smoke test exercises.
      # DATABASE__URL is filled in by the "Generate ephemeral CI credentials"
      # step below so the password is never a static literal in this file.
      DATABASE__ENABLED: "true"
      BILLING__ENABLED: "true"
      AUTH_ENABLED: "true"
      EMAIL__ENABLED: "false"
      EMAIL__PROVIDER: console
      MODEL_PATH: "models/model_vignn_rank1.pth"
      LOG_FORMAT: text

    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral CI credentials
        # `openssl rand` produces fresh per-run secrets. `::add-mask::` registers
        # them with the runner so they're redacted from any subsequent log line.
        # Nothing about these credentials appears in the YAML — GitGuardian's
        # keyword matcher has no target.
        run: |
          PG_PWD="$(openssl rand -hex 16)"
          JWT="$(openssl rand -hex 32)"
          echo "::add-mask::$PG_PWD"
          echo "::add-mask::$JWT"
          {
            echo "PG_USER=ci_user"
            echo "PG_DB=ci_billing"
            echo "PG_PWD=$PG_PWD"
            echo "JWT_SECRET=$JWT"
            echo "DATABASE__URL=postgresql+asyncpg://ci_user:${PG_PWD}@127.0.0.1:5432/ci_billing"
            echo "TEST_DATABASE_URL=postgresql+asyncpg://ci_user:${PG_PWD}@127.0.0.1:5432/ci_billing"
          } >> "$GITHUB_ENV"

      - name: Start Postgres 16 container
        # Named container ("pg") so subsequent steps can target it
        # deterministically — no `docker ps --filter ancestor=…` guessing.
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER="$PG_USER" \
            -e POSTGRES_PASSWORD="$PG_PWD" \
            -e POSTGRES_DB="$PG_DB" \
            -p 127.0.0.1:5432:5432 \
            postgres:16-alpine

      - name: Install uv (pinned for reproducible CI)
        uses: astral-sh/setup-uv@v3
        with:
          # Pinned to the 0.5 line — bumping is intentional, not implicit.
          version: "0.5.18"
          enable-cache: true
          # uv.lock is .gitignored in this repo, so hash pyproject.toml only.
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync project venv (core + dev deps only)
        # `--all-extras` would pull wandb → kaleido==0.2.1.post1 which only
        # ships an armv7l wheel. uv.lock is not committed in this repo so
        # `--frozen` can't be used; pyproject.toml's tool.uv.override-
        # dependencies pin kaleido>=1.0 to keep resolution stable across runs.
        run: uv sync --dev

      - name: Wait for Postgres readiness
        # Runs pg_isready INSIDE the postgres container — no need to install
        # postgresql-client on the runner just for the probe.
        run: |
          for i in {1..30}; do
            if docker exec pg pg_isready -U "$PG_USER" -d "$PG_DB" -q; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready"
          docker logs pg --tail 80
          exit 1

      - name: Apply Alembic migrations
        run: uv run alembic -c backend/alembic.ini upgrade head

      - name: Verify plan seed
        run: |
          uv run python - <<'PY'
          import asyncio, os, asyncpg
          # asyncpg DSN (no +asyncpg flavour suffix) for the raw connect.
          dsn = os.environ["DATABASE__URL"].replace("+asyncpg", "")
          async def check():
              conn = await asyncpg.connect(dsn)
              rows = await conn.fetch("SELECT code FROM plans ORDER BY sort_order")
              codes = [r["code"] for r in rows]
              await conn.close()
              assert codes == ["free", "clinician", "practice", "health_system"], codes
              print("plans seeded:", codes)
          asyncio.run(check())
          PY

      - name: Run billing smoke
        run: uv run pytest tests/test_billing_smoke.py -v --tb=short --color=yes

      - name: Postgres logs on failure
        if: failure()
        # Deterministic container name — no filter ambiguity.
        run: docker logs pg --tail 200 || true

      - name: Cleanup
        if: always()
        run: docker rm -f pg || true

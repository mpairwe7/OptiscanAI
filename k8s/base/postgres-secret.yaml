# Postgres credentials for the sidecar (Option 2).
# Replace the base64 values OR seal them via your secret-manager workflow
# (sealed-secrets / external-secrets-operator / sops).
#
# Generate fresh values with:
#   echo -n 'optiscan'                | base64
#   openssl rand -hex 32 | tr -d '\n' | base64
apiVersion: v1
kind: Secret
metadata:
  name: optiscan-postgres
  namespace: retinalai
  labels:
    app: optiscan
type: Opaque
stringData:
  POSTGRES_USER: optiscan
  POSTGRES_DB: optiscan
  # In production: replace via `kubectl create secret generic optiscan-postgres
  # --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 32)` and remove
  # this stringData value before applying.
  POSTGRES_PASSWORD: change-me-in-production

# Full-stack RetinalAI 2026 production deployment.
# Usage: docker compose -f docker-compose.yml -f docker-compose.2026.yml up -d
#
# Includes: FastAPI + MLflow + OTEL Collector + Jaeger + Prometheus +
#           Ray Serve + Kafka + Zookeeper

services:
  # ── Override API with all Phase 1-4 features ──
  api:
    environment:
      # Phase 1: Observability
      - TELEMETRY__ENABLED=true
      - TELEMETRY__OTLP_ENDPOINT=http://otel-collector:4317
      - TELEMETRY__SERVICE_NAME=retinalai
      # Phase 1: MLflow
      - MLFLOW__ENABLED=true
      - MLFLOW__TRACKING_URI=http://mlflow:5000
      # Phase 1: Active Learning
      - ACTIVE_LEARNING_LOOP__ENABLED=true
      - ACTIVE_LEARNING_LOOP__RETRAIN_THRESHOLD=150
      # Phase 1: Drift Detection
      - DRIFT__ENABLED=true
      - DRIFT__CHECK_INTERVAL=100
      # Phase 2: Ray Serve
      - RAY__ENABLED=true
      - RAY__SERVE_URL=http://ray-head:8000
      # Phase 2: Kafka
      - KAFKA__ENABLED=true
      - KAFKA__BOOTSTRAP_SERVERS=kafka:29092
      # Phase 2: Security
      - MTLS__ENABLED=false
      # Phase 3: Edge
      - EDGE__ONNX_ENABLED=true
      - EDGE__ONNX_MODEL_PATH=models/export/model.onnx
      # Phase 3: Governance
      - FAIRNESS__ENABLED=true
      - MODEL_CARD__AUTO_GENERATE=true
      # Phase 4: Resilience
      - RESILIENCE__ENABLED=true
    depends_on:
      otel-collector:
        condition: service_started
      mlflow:
        condition: service_healthy
      kafka:
        condition: service_started

  # ── Phase 1: Observability Stack ──

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: retinal-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: retinal-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: retinal-prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ── Phase 1: MLflow Registry ──

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: retinal-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Phase 2: Ray Serve Cluster ──

  ray-head:
    image: rayproject/ray:2.40.0-py310-gpu
    container_name: retinal-ray-head
    command: >
      ray start --head
      --dashboard-host=0.0.0.0
      --port=6379
      --block
    ports:
      - "8265:8265"   # Ray Dashboard
      - "8000:8000"   # Ray Serve
      - "6379:6379"   # Ray GCS
    volumes:
      - ./models:/app/models:ro
      - ./src:/app/src:ro
    environment:
      - RAY_SERVE_ENABLE_EXPERIMENTAL_STREAMING=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Phase 2: Kafka + Zookeeper ──

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: retinal-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: retinal-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prometheus-data:
  mlflow-data:

name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'backend/**'
      - 'frontend/**'
      - 'models/**'
      - 'configs/**'
      - 'Dockerfile.hf'
      - 'pyproject.toml'
  workflow_dispatch:

env:
  HF_SPACE: Mpairwe49/retinal-screening
  HF_SPACE_URL: https://huggingface.co/spaces/Mpairwe49/retinal-screening

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # lfs: true fetches LFS objects but actions/checkout@v4 on a shallow
      # clone doesn't reliably smudge them into the working tree
      # (actions/checkout#270). The explicit `git lfs pull` below
      # force-replaces every LFS pointer with the real binary — pytest
      # triggers FastAPI's lifespan, which torch.load()s
      # models/model_vignn_rank1.pth (137 MB). Otherwise:
      #   _pickle.UnpicklingError: invalid load key, 'v'.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Smudge LFS objects into working tree
        run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and test
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          PYTHONPATH=. pytest tests/ -v --tb=short -x
        env:
          CUDA_VISIBLE_DEVICES: ""

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Hugging Face CLI
        run: pip install "huggingface_hub[cli]"

      - name: Login to Hugging Face
        # `huggingface-cli login` is deprecated in huggingface_hub>=1.0 and the
        # command is now `hf auth login`. Read the token from env so an empty
        # secret produces a clear error instead of a silent empty-token call.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is empty — set repo/org secret 'HF_TOKEN' to a Hugging Face write token before re-running."
            exit 1
          fi
          hf auth login --token "$HF_TOKEN" --add-to-git-credential

      - name: Prepare Space repository
        run: |
          # Clone or init the HF Space repo
          git clone https://huggingface.co/spaces/${{ env.HF_SPACE }} hf_space 2>/dev/null || mkdir -p hf_space

          # Create Space README with metadata
          cat > hf_space/README.md << 'EOF'
          ---
          title: RetinalAI Clinical Screening
          emoji: 👁️
          colorFrom: blue
          colorTo: green
          sdk: docker
          app_port: 7860
          pinned: true
          license: cc-by-4.0
          short_description: AI-powered retinal disease screening — 45 diseases, <200ms, clinical reasoning
          ---

          # RetinalAI: AI-Powered Retinal Disease Screening

          Multi-label classification of 45 retinal diseases from fundus images using Graph Neural Networks with Clinical Knowledge Graph reasoning.

          **Features:**
          - 45-disease simultaneous screening from single fundus image
          - Clinical Knowledge Graph with 144 disease relationships
          - 5 explainability methods (GradCAM, LIME, SHAP, IG, ELI5)
          - Referral priority ranking (Emergency / Urgent / Routine)
          - Sub-200ms inference latency
          EOF

          # Copy Dockerfile
          cp Dockerfile.hf hf_space/Dockerfile

          # Copy application code. pretrained_weights/ is excluded — the
          # vit_small_patch16_224.safetensors backbone is timm/HF-Hub
          # downloadable at Space build time (timm.create_model fetches it
          # transparently). Shipping it via LFS push to the Space fails
          # whenever the LFS object isn't in the runner's local store
          # (LFS bandwidth caps, partial fetch) — and there's no point
          # double-paying bandwidth for a public checkpoint.
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.next' \
                    --exclude='__pycache__' --exclude='.venv' --exclude='outputs' \
                    --exclude='data' --exclude='wandb' --exclude='mlruns' \
                    --exclude='.env' --exclude='*.onnx' --exclude='docs' \
                    --exclude='logs' --exclude='hf_space' \
                    --exclude='pretrained_weights' \
                    ./ hf_space/

      - name: Push to HF Spaces
        working-directory: hf_space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
        run: |
          # Git needs an identity to commit. The runner has no global config,
          # so the previous step crashed with `empty ident name not allowed`.
          git config user.email "ci@optiscan.makstartup.com"
          git config user.name "OptiscanAI CI"

          git lfs install
          git lfs track "*.pth"
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy $(date +%Y%m%d-%H%M%S) from ${GITHUB_SHA::8}"

          # `hf auth login --add-to-git-credential` doesn't always wire the
          # HF Hub push path. Inject the token straight into the remote URL
          # (rewritten in-place — no other process sees it).
          HF_USER="${HF_USER:-Mpairwe49}"
          git remote set-url origin "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${{ env.HF_SPACE }}"
          git push origin HEAD:main

      - name: Wait for Space build
        run: |
          echo "Deployment triggered: ${{ env.HF_SPACE_URL }}"
          echo "Monitor build at: ${{ env.HF_SPACE_URL }}/logs"
          # Give HF a moment to start building
          sleep 10
          # Check Space status
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi()
          info = api.space_info('${{ env.HF_SPACE }}')
          print(f'Space status: {info.runtime}')
          print(f'URL: https://${{ env.HF_SPACE }}.hf.space')
          " || echo "Space info check skipped"

      - name: Post-deploy health check
        run: |
          echo "Space URL: https://mpairwe49-retinal-screening.hf.space"
          echo "Health endpoint: https://mpairwe49-retinal-screening.hf.space/health"
          echo "API docs: https://mpairwe49-retinal-screening.hf.space/docs"
          # HF Spaces takes 5-15 min to build Docker images
          # Health check will be verified in next workflow run

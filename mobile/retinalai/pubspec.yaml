name: retinalai
description: RetinalAI Clinical Screening - Offline-first mobile app for retinal disease detection

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Database (Drift — type-safe reactive SQLite)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # ONNX Runtime for on-device inference
  onnxruntime: ^1.4.1

  # Camera
  camera: ^0.11.0

  # Networking
  http: ^1.2.0
  connectivity_plus: ^6.0.0

  # Image processing
  image: ^4.1.0

  # Cryptography (SHA-256 for audit trail)
  crypto: ^3.0.0

  # Archive handling (bundle decompression)
  archive: ^3.6.0

  # UUID generation
  uuid: ^4.3.0

  # JSON serialization
  json_annotation: ^4.8.0

  # Permissions
  permission_handler: ^11.3.0

  # File picker (for debug/testing)
  file_picker: ^8.0.0

  # Logging
  logger: ^2.2.0

  # Intl (date formatting)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/config/

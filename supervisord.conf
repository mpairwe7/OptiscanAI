[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:backend]
command=/opt/venv/bin/uvicorn backend.app.main:app --host 127.0.0.1 --port 8080
directory=/app
environment=MODEL_PATH="models/model_vignn_rank1.pth",CUDA_VISIBLE_DEVICES="%(ENV_CUDA_VISIBLE_DEVICES)s",DEVICE="%(ENV_DEVICE)s",API_PORT="8080",LOG_FORMAT="text"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=5

[program:frontend]
command=node server.js
directory=/app/frontend/.next/standalone
environment=PORT="3000",HOSTNAME="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=3

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=1

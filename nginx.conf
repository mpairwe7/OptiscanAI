server {
    listen 7860;
    server_name _;
    client_max_body_size 15M;

    # Next.js static assets — served directly by nginx from /srv/nextjs
    # URL /_next/static/foo.css -> /srv/nextjs/_next/static/foo.css
    location /_next/static/ {
        root /srv/nextjs;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Public files (favicons, icons, manifest, sw.js)
    location ~* \.(png|ico|svg|webmanifest|js)$ {
        root /srv/nextjs;
        try_files $uri @nextjs;
        expires 30d;
        access_log off;
    }

    # Backend API passthrough
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Phase 5 API routes (offline, quantized, monitoring, voice)
    location /v1/ {
        proxy_pass http://127.0.0.1:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8080/docs;
        proxy_http_version 1.1;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8080/openapi.json;
        proxy_http_version 1.1;
    }

    # Frontend (Next.js standalone) — pages and SSR
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Named fallback for public file regex
    location @nextjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:postgres]
command=/usr/local/bin/postgres-bootstrap.sh
user=optiscan
priority=10
environment=PGDATA="/var/lib/postgresql/data",POSTGRES_USER="optiscan",POSTGRES_PASSWORD="optiscan",POSTGRES_DB="optiscan",PG_BIN="/usr/lib/postgresql/15/bin"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=3
stopwaitsecs=15
stopsignal=INT

[program:backend]
command=/usr/local/bin/backend-start.sh
directory=/app
user=optiscan
priority=20
environment=HOME="/tmp",MODEL_PATH="models/model_vignn_rank1.pth",CUDA_VISIBLE_DEVICES="-1",DEVICE="cpu",API_PORT="8081",LOG_FORMAT="text",PYTHONPATH="/app",POSTGRES_HOST="127.0.0.1",POSTGRES_PORT="5432",POSTGRES_USER="optiscan",DATABASE__ENABLED="true",DATABASE__URL="postgresql+asyncpg://optiscan:optiscan@127.0.0.1:5432/optiscan",EMBEDDED_POSTGRES__ENABLED="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stopsignal=TERM

[program:frontend]
command=node server.js
directory=/app/frontend/.next/standalone
user=optiscan
priority=30
environment=PORT="3000",HOSTNAME="127.0.0.1",HOME="/tmp"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=3
stopwaitsecs=5
stopsignal=TERM

[program:nginx]
command=nginx -g "daemon off;"
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=1
stopwaitsecs=5
stopsignal=QUIT

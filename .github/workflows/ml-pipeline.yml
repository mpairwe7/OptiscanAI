name: ML Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install linters
        run: pip install ruff black
      - name: Ruff lint
        run: ruff check src/ backend/ scripts/ train.py
      - name: Black format check
        run: black --check src/ backend/ scripts/ train.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v --tb=short -x
        env:
          CUDA_VISIBLE_DEVICES: ""

  model-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Validate model architectures
        run: |
          PYTHONPATH=. python -c "
          from src.models.vignn import create_vignn_model, ClinicalKnowledgeGraph
          from src.data.datamodule import DISEASE_COLUMNS
          import torch
          kg = ClinicalKnowledgeGraph(DISEASE_COLUMNS)
          model = create_vignn_model(num_classes=45, clinical_knowledge_graph=kg, hidden_dim=64, num_heads=2, num_graph_layers=1)
          x = torch.randn(1, 3, 224, 224)
          out = model(x)
          assert out.shape == (1, 45), f'Expected (1,45) got {out.shape}'
          print('Model validation PASSED')
          "
      - name: Validate data pipeline
        run: |
          PYTHONPATH=. python -c "
          from src.data.validation import DataValidator
          from src.data.datamodule import DISEASE_COLUMNS
          print(f'DataValidator initialized with {len(DISEASE_COLUMNS)} disease columns')
          print('Data pipeline validation PASSED')
          "

  data-quality:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Generate synthetic data and validate
        run: |
          PYTHONPATH=. python scripts/generate_synthetic_data.py
          PYTHONPATH=. python -c "
          from src.data.validation import DataValidator
          from src.data.datamodule import DISEASE_COLUMNS
          import pandas as pd
          validator = DataValidator(DISEASE_COLUMNS)
          # Validate synthetic data structure
          print('Data quality checks available')
          "

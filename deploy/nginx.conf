server {
    listen 7860;
    server_name _;
    client_max_body_size 15M;

    # Text compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Next.js static assets — served directly by nginx from /srv/nextjs
    location /_next/static/ {
        root /srv/nextjs;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Public files (favicons, icons, manifest, sw.js)
    location ~* \.(png|ico|svg|webmanifest|js)$ {
        root /srv/nextjs;
        try_files $uri @nextjs;
        expires 30d;
        access_log off;
    }

    # Backend API passthrough
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Phase 5 API routes (offline, quantized, monitoring, voice)
    location /v1/ {
        proxy_pass http://127.0.0.1:8081/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_http_version 1.1;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8081/docs;
        proxy_http_version 1.1;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8081/openapi.json;
        proxy_http_version 1.1;
    }

    # Frontend (Next.js standalone) — pages and SSR
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Named fallback for public file regex
    location @nextjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

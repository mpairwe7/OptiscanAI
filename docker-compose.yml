services:
  # ─── Postgres sidecar (Option 2 — production-ready) ─────────────────────────
  # Decoupled DB lifecycle from the app: restart, scale, back up independently.
  # See docs/23-billing-platform.md § 14 for the alternative shapes (embedded /
  # managed) and for migration runbooks.
  postgres:
    image: postgres:16-alpine
    container_name: retinal-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-optiscan}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-optiscan}
      - POSTGRES_DB=${POSTGRES_DB:-optiscan}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - optiscan-pgdata:/var/lib/postgresql/data
    # Bound to host loopback so devs can `psql` directly during debugging.
    # Drop the `127.0.0.1:` prefix to expose for remote access (NOT recommended).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-optiscan} -d $${POSTGRES_DB:-optiscan}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # GPU API backend (supports quantized models + offline RAG)
  api:
    image: landwind/optiscan-ai:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retinal-api
    ports:
      - "8080:8080"
    environment:
      - MODEL_PATH=models/model_vignn_rank1.pth
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - CUDA_VISIBLE_DEVICES=0
      - FUNDUS_GATE__ENABLED=true
      - FUNDUS_GATE__MODEL_PATH=weights/fundus_gate.pth
      # Phase 5: Offline + Quantization (opt-in)
      - OFFLINE_RAG__ENABLED=${OFFLINE_RAG__ENABLED:-false}
      - OFFLINE_RAG__INDEX_DIR=data/offline_rag/index
      - OFFLINE_RAG__BUNDLES_DIR=data/offline_rag/bundles
      - QUANTIZATION__ENABLED=${QUANTIZATION__ENABLED:-false}
      - QUANTIZATION__ACTIVE_FORMAT=${QUANTIZATION__ACTIVE_FORMAT:-}
      - QUANTIZATION__TORCH_COMPILE_ENABLED=${QUANTIZATION__TORCH_COMPILE_ENABLED:-false}
      - VOICE_FIRST__ENABLED=${VOICE_FIRST__ENABLED:-false}
      # Phase 3: Uganda ecosystem (opt-in)
      - DHIS2__ENABLED=${DHIS2__ENABLED:-false}
      - DHIS2__BASE_URL=${DHIS2__BASE_URL:-}
      - MOBILE_MONEY__ENABLED=${MOBILE_MONEY__ENABLED:-false}
      - AFRICASTALKING__ENABLED=${AFRICASTALKING__ENABLED:-false}
      # Phase 4: Federated + Multimodal (opt-in)
      - FEDERATED__ENABLED=${FEDERATED__ENABLED:-false}
      - MULTIMODAL__ENABLED=${MULTIMODAL__ENABLED:-false}
      # Phase 6: Subscription billing — points the app at the sidecar Postgres
      - DATABASE__ENABLED=${DATABASE__ENABLED:-true}
      - DATABASE__URL=postgresql+asyncpg://${POSTGRES_USER:-optiscan}:${POSTGRES_PASSWORD:-optiscan}@postgres:5432/${POSTGRES_DB:-optiscan}
      - BILLING__ENABLED=${BILLING__ENABLED:-true}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://www.optiscan.makstartup.com}
      # Suppress the in-container Postgres now that we have a sidecar
      - EMBEDDED_POSTGRES__ENABLED=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-optiscan}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./weights:/app/weights
      - ./outputs:/app/outputs
      - ./data/offline_rag:/app/data/offline_rag
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # CPU-only variant
  api-cpu:
    image: landwind/optiscan-ai:latest
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: retinal-api-cpu
    profiles: [cpu]
    ports:
      - "8081:8080"
    environment:
      - MODEL_PATH=models/model_vignn_rank1.pth
      - CUDA_VISIBLE_DEVICES=-1
      # Sidecar-Postgres wiring (same defaults as the GPU api service)
      - DATABASE__ENABLED=${DATABASE__ENABLED:-true}
      - DATABASE__URL=postgresql+asyncpg://${POSTGRES_USER:-optiscan}:${POSTGRES_PASSWORD:-optiscan}@postgres:5432/${POSTGRES_DB:-optiscan}
      - BILLING__ENABLED=${BILLING__ENABLED:-true}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://www.optiscan.makstartup.com}
      - EMBEDDED_POSTGRES__ENABLED=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-optiscan}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  # Hugging Face Spaces build (local test before pushing)
  # CPU-only: mirrors the HF Spaces free-tier environment.
  # HF doesn't support sidecar containers, so this profile keeps the embedded
  # Postgres path active. SaaS billing is OFF here by default.
  hf:
    build:
      context: .
      dockerfile: Dockerfile.hf
    container_name: retinal-hf
    profiles: [hf]
    ports:
      - "7860:7860"
    environment:
      - MODEL_PATH=models/model_vignn_rank1.pth
      - CUDA_VISIBLE_DEVICES=-1
      - DEVICE=cpu
      - FUNDUS_GATE__ENABLED=true
      - FUNDUS_GATE__MODEL_PATH=weights/fundus_gate.pth
      - DATABASE__ENABLED=${HF_DATABASE__ENABLED:-false}
      - BILLING__ENABLED=${HF_BILLING__ENABLED:-false}
      - EMBEDDED_POSTGRES__ENABLED=${HF_EMBEDDED_POSTGRES__ENABLED:-true}
    volumes:
      - ./models:/app/models
      - ./weights:/app/weights
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  # Persistent Postgres data — survives `docker compose down`,
  # removed by `docker compose down -v`.
  optiscan-pgdata:

# Usage:
#   docker compose up -d                 # GPU api + sidecar Postgres
#   docker compose --profile cpu up      # CPU api + sidecar Postgres
#   docker compose --profile hf up       # HF Spaces (full stack on 7860, no sidecar)
#   docker compose exec postgres psql -U optiscan optiscan   # direct DB access
#   docker compose logs -f
#
# Required .env entries (see .env.example):
#   JWT_SECRET=…                       # generate with: openssl rand -hex 32
#   POSTGRES_PASSWORD=…                # any strong password
#   PUBLIC_APP_URL=https://www.optiscan.makstartup.com

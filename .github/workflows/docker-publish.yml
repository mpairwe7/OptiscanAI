name: CI/CD — Build, Push & Deploy

on:
  push:
    branches: [main, dev]
    paths:
      - 'deploy/Dockerfile'
      - 'deploy/Dockerfile.cpu'
      - 'pyproject.toml'
      - 'src/**'
      - 'backend/**'
      - 'frontend/**'
      - 'configs/**'
      - 'models/**'
      - 'weights/**'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip build, only redeploy Crane Cloud'
        type: boolean
        default: false
      redeploy_sha:
        description: 'deploy_only: 7-char SHA of an already-built image to re-roll (e.g. 9793a58). Empty = env-only, no image change.'
        type: string
        default: ''

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  CRANE_CLOUD_API: https://api.cranecloud.io

jobs:
  # ─── Stage 1: Lint + Test ───
  test:
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    steps:
      # lfs: true fetches LFS objects but actions/checkout@v4 on a shallow
      # clone doesn't reliably smudge them into the working tree
      # (actions/checkout#270). The explicit `git lfs pull` below
      # force-replaces every LFS pointer with the real binary — pytest
      # triggers FastAPI's lifespan, which torch.load()s the .pth.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Smudge LFS objects into working tree
        run: git lfs pull || true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Pin black — its default style bumps yearly; a floating install
          # would reformat the tree out from under the codebase. 26.3.1
          # matches uv.lock and patches GHSA-3936-cmfr-pm3m. 26.x needs
          # pathspec>=1.0, kept out of the flwr fork via [tool.uv].conflicts.
          pip install ruff "black==26.3.1"
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ backend/ scripts/ train.py
          black --check src/ backend/ scripts/ train.py

      - name: Test
        run: PYTHONPATH=. pytest tests/ -v --tb=short -x
        env:
          CUDA_VISIBLE_DEVICES: ""

  # ─── Stage 2: Build & Push Docker Images ───
  build-and-push:
    if: ${{ !inputs.deploy_only }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # The two images are independent, and fail-fast cancels the sibling the
      # moment one dies — which reported the CPU build as "cancelled" and hid
      # whether it was actually healthy while the GPU build was broken. Let both
      # finish so each variant's status means what it says.
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            dockerfile: deploy/Dockerfile
            image: optiscan-ai
            tag: latest
          - variant: cpu
            dockerfile: deploy/Dockerfile.cpu
            image: optiscan-ai
            tag: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Smudge LFS weights into the build context
        run: |
          # models/model_vignn_rank1.pth is tracked in Git LFS. Without this,
          # the build context holds the LFS *pointer*, the image ships a ~134-byte
          # text file, and torch.load() fails at runtime -> /health reports
          # model_loaded:false. The test job pulls LFS for the same reason.
          git lfs pull
          sz=$(stat -c%s models/model_vignn_rank1.pth)
          echo "model_vignn_rank1.pth: ${sz} bytes"
          if [ "$sz" -lt 10000 ]; then
            echo "::error::model checkpoint is still an LFS pointer (${sz} bytes) — git lfs pull did not fetch the real weights; refusing to build a broken image"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,prefix=${{ matrix.tag }}-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Verify image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ matrix.tag }}

  # ─── Stage 3: Deploy to Crane Cloud (RENU) ───
  deploy-crane-cloud:
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success' || inputs.deploy_only)
    runs-on: ubuntu-latest
    steps:
      # The deploy job runs on its own runner, so it must check out the repo to
      # get .github/scripts/crane_deploy.py. lfs:false skips the big model blobs.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Deploy to Crane Cloud (image + managed DB env)
        env:
          CRANE_EMAIL: ${{ secrets.CRANE_CLOUD_EMAIL }}
          CRANE_PASSWORD: ${{ secrets.CRANE_CLOUD_PASSWORD }}
          CRANE_CPU_APP_ID: ${{ secrets.CRANE_CLOUD_CPU_APP_ID }}
          CRANE_GPU_APP_ID: ${{ secrets.CRANE_CLOUD_GPU_APP_ID }}
          # Single secret carrying the DB password; pg_isready host/port/user
          # are derived from it inside crane_deploy.py so they need not be
          # stored (or committed) separately.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Agentic-AI provider. Absent/empty -> the backend's LLM layer reports
          # provider "none" and the agent graph runs deterministic clinical
          # rules, so a missing secret degrades rather than breaks the deploy.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Sunbird cloud voice tier for Ugandan languages. Absent/empty -> the
          # voice stack stays local-only (whisper/piper), which is the behaviour
          # before the tier existed. The double underscore is pydantic-settings'
          # nested delimiter and must survive into the container's env.
          SUNBIRD__API_TOKEN: ${{ secrets.SUNBIRD__API_TOKEN }}
          SUNBIRD__FALLBACK_API_TOKEN: ${{ secrets.SUNBIRD__FALLBACK_API_TOKEN }}
          SUNBIRD__ENABLED: ${{ vars.SUNBIRD__ENABLED }}
          # Informational account handles, so logs can name which account served
          # or exhausted its quota. Read from secrets because that is where they
          # are stored; Actions masks them in logs either way.
          SUNBIRD__USERNAME: ${{ secrets.SUNBIRD__USERNAME }}
          SUNBIRD__FALLBACK_USERNAME: ${{ secrets.SUNBIRD__FALLBACK_USERNAME }}
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
          REDEPLOY_SHA: ${{ inputs.redeploy_sha }}
        run: |
          set -euo pipefail

          # Normal run: point at the freshly built SHA-pinned tags so Crane Cloud
          # (which diffs by image string) actually rolls the pod over —
          # metadata-action publishes them as `<tag>-<sha-7>`.
          # Deploy-only run: the build was skipped, so those tags don't exist —
          # leave them empty and PATCH env_vars alone (switch DB, no rebuild),
          # UNLESS redeploy_sha names an already-built image to re-roll
          # (rollback / re-attempt a failed deploy without a rebuild).
          if [ "${DEPLOY_ONLY:-false}" != "true" ]; then
            SHA7="${GITHUB_SHA:0:7}"
            export CPU_TAG="landwind/optiscan-ai:cpu-${SHA7}"
            export GPU_TAG="landwind/optiscan-ai:latest-${SHA7}"
          elif [ -n "${REDEPLOY_SHA:-}" ]; then
            export CPU_TAG="landwind/optiscan-ai:cpu-${REDEPLOY_SHA}"
            export GPU_TAG="landwind/optiscan-ai:latest-${REDEPLOY_SHA}"
          fi

          # Logs in, then PATCHes both apps. Crane Cloud MERGES env_vars on
          # PATCH, so this asserts the managed-DB config without wiping
          # MODEL_PATH/DEVICE/etc. DATABASE_URL is never printed.
          python3 .github/scripts/crane_deploy.py

      - name: Health check (CPU)
        env:
          CRANE_CPU_URL: ${{ secrets.CRANE_CLOUD_CPU_URL }}
        run: |
          URL="${CRANE_CPU_URL:-https://optiscan-ai-d3a3669f.renu-01.cranecloud.io}"
          echo "Waiting for deployment at $URL..."
          for i in $(seq 1 20); do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" "$URL/health" 2>/dev/null || echo "000")
            echo "  [$i] health=$HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "Deployment healthy!"
              curl -sf "$URL/health" | python3 -m json.tool
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Health check did not pass within 5 minutes"

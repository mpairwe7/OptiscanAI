name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'backend/**'
      - 'frontend/**'
      - 'models/**'
      - 'configs/**'
      - 'deploy/Dockerfile.hf'
      - 'pyproject.toml'
  workflow_dispatch:

# A push to frontend/** and a manual dispatch both trigger this workflow, which
# produced two concurrent runs on the same commit: both cloned the Space, one
# pushed, the other was rejected non-fast-forward. Queue them instead of running
# in parallel; do not cancel in-progress runs, since cancelling mid-push can
# leave the Space with a partial tree.
concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

env:
  HF_SPACE: landwind22/Retinal_Screening
  HF_SPACE_URL: https://huggingface.co/spaces/landwind22/Retinal_Screening

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # lfs: true fetches LFS objects but actions/checkout@v4 on a shallow
      # clone doesn't reliably smudge them into the working tree
      # (actions/checkout#270). The explicit `git lfs pull` below
      # force-replaces every LFS pointer with the real binary — pytest
      # triggers FastAPI's lifespan, which torch.load()s
      # models/model_vignn_rank1.pth (137 MB). Otherwise:
      #   _pickle.UnpicklingError: invalid load key, 'v'.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Smudge LFS objects into working tree
        run: git lfs pull || true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install and test
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          PYTHONPATH=. pytest tests/ -v --tb=short -x
        env:
          CUDA_VISIBLE_DEVICES: ""

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install Hugging Face CLI
        run: pip install "huggingface_hub[cli]"

      - name: Login to Hugging Face
        # `huggingface-cli login` is deprecated in huggingface_hub>=1.0 and the
        # command is now `hf auth login`. Read the token from env so an empty
        # secret produces a clear error instead of a silent empty-token call.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is empty — set repo/org secret 'HF_TOKEN' to a Hugging Face write token before re-running."
            exit 1
          fi
          hf auth login --token "$HF_TOKEN" --add-to-git-credential

      - name: Prepare Space repository
        run: |
          # Clone or init the HF Space repo
          git clone https://huggingface.co/spaces/${{ env.HF_SPACE }} hf_space 2>/dev/null || mkdir -p hf_space

          # Create Space README with metadata
          cat > hf_space/README.md << 'EOF'
          ---
          title: RetinalAI Clinical Screening
          emoji: 👁️
          colorFrom: blue
          colorTo: green
          sdk: docker
          app_port: 7860
          pinned: true
          license: cc-by-4.0
          # The Hub rejects a short_description over 60 characters, and an
          # unquoted value containing a colon is invalid YAML. Either mistake
          # fails /api/validate-yaml and leaves the Space in CONFIG_ERROR.
          short_description: "AI retinal screening: 45 diseases, clinical reasoning"
          ---

          # RetinalAI: AI-Powered Retinal Disease Screening

          Multi-label classification of 45 retinal diseases from fundus images using Graph Neural Networks with Clinical Knowledge Graph reasoning.

          **Features:**
          - 45-disease simultaneous screening from single fundus image
          - Clinical Knowledge Graph with 144 disease relationships
          - 5 explainability methods (GradCAM, LIME, SHAP, IG, ELI5)
          - Referral priority ranking (Emergency / Urgent / Routine)
          - Sub-200ms inference latency
          EOF

          # Copy Dockerfile
          cp deploy/Dockerfile.hf hf_space/Dockerfile

          # Copy application code. pretrained_weights/ is excluded — the
          # vit_small_patch16_224.safetensors backbone is timm/HF-Hub
          # downloadable at Space build time (timm.create_model fetches it
          # transparently). Shipping it via LFS push to the Space fails
          # whenever the LFS object isn't in the runner's local store
          # (LFS bandwidth caps, partial fetch) — and there's no point
          # double-paying bandwidth for a public checkpoint.
          # --delete removes files left in the Space from earlier deploys.
          # Without it a stale frontend/src/app/page.tsx survived here and broke
          # `next build` (it referenced a store field that no longer exists), so
          # the Space failed to build even though the tree it was built from was
          # fine. Excluded paths (.git etc.) are protected from deletion.
          #
          # README.md and Dockerfile are excluded because both are *synthesised*
          # into the Space above and neither exists at the repo root — so
          # --delete would remove them again, and the repo's own README.md would
          # also overwrite the Space one. Losing the README front-matter gives
          # CONFIG_ERROR (no `sdk: docker`/`app_port`); losing the Dockerfile
          # gives NO_APP_FILE. In both cases the push still reports success, so
          # the failure only shows up in the Space's runtime stage.
          rsync -av --delete --exclude='.git' \
                    --exclude='README.md' --exclude='Dockerfile' \
                    --exclude='node_modules' --exclude='.next' \
                    --exclude='__pycache__' --exclude='.venv' --exclude='outputs' \
                    --exclude='data' --exclude='wandb' --exclude='mlruns' \
                    --exclude='.env' --exclude='*.onnx' --exclude='docs' \
                    --exclude='logs' --exclude='hf_space' \
                    --exclude='pretrained_weights' \
                    ./ hf_space/

      - name: Push to HF Spaces
        working-directory: hf_space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
        run: |
          # Git needs an identity to commit. The runner has no global config,
          # so the previous step crashed with `empty ident name not allowed`.
          git config user.email "ci@optiscan.makstartup.com"
          git config user.name "OptiscanAI CI"

          git lfs install
          git lfs track "*.pth"
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy $(date +%Y%m%d-%H%M%S) from ${GITHUB_SHA::8}"

          # `hf auth login --add-to-git-credential` doesn't always wire the
          # HF Hub push path. Inject the token straight into the remote URL
          # (rewritten in-place — no other process sees it).
          # Must match the owner of HF_SPACE. The repo secrets HF_TOKEN and
          # HF_USER have to belong to that account too — a token for a different
          # account gets 403 on push, however valid it is.
          HF_USER="${HF_USER:-landwind22}"
          git remote set-url origin "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${{ env.HF_SPACE }}"
          # The Space is a build artifact regenerated wholly from this repo on
          # every run — it is never a source of truth — so if the remote moved
          # (a queued run, or a manual recovery push), our freshly built tree is
          # the state we want. Refetch and retry once before forcing, so a
          # genuine concurrent deploy is preserved rather than silently lost.
          git push origin HEAD:main || {
            echo "push rejected — refetching and retrying"
            git fetch origin main
            git reset --soft origin/main
            git commit -m "Deploy $(date +%Y%m%d-%H%M%S) from ${GITHUB_SHA::8} (retry)" || true
            git push origin HEAD:main
          }

      # Space secrets live in the Space's own settings, not in the pushed tree,
      # so the agentic-AI key has to be set through the Hub API. Without it the
      # backend's LLM layer reports provider "none" and the agent graph serves
      # deterministic clinical rules — degraded, not broken — so a missing
      # repo secret is a warning rather than a failure.
      - name: Sync Gemini secret to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ env.HF_SPACE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SUNBIRD__API_TOKEN: ${{ secrets.SUNBIRD__API_TOKEN }}
          SUNBIRD__FALLBACK_API_TOKEN: ${{ secrets.SUNBIRD__FALLBACK_API_TOKEN }}
          SUNBIRD__ENABLED: ${{ vars.SUNBIRD__ENABLED }}
        run: |
          python3 - <<'PY'
          import os, sys
          from huggingface_hub import HfApi

          key = (os.environ.get("GEMINI_API_KEY") or "").strip()
          if not key:
              print("::warning::GEMINI_API_KEY repo secret is empty — the Space will "
                    "run the deterministic clinical-rules fallback instead of Gemini")
              sys.exit(0)

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          model = (os.environ.get("GEMINI_MODEL") or "").strip() or "gemini-3.7-flash"

          # add_space_secret overwrites an existing value, so this also rotates
          # the key. The value is never echoed — only the variable name.
          api.add_space_secret(repo_id=space, key="GEMINI_API_KEY", value=key)
          print("  set Space secret: GEMINI_API_KEY (***)")

          # The model pin is not a secret; a Space *variable* keeps it visible
          # and editable in the Space UI.
          api.add_space_variable(repo_id=space, key="GEMINI_MODEL", value=model)
          print(f"  set Space variable: GEMINI_MODEL={model}")
          PY

      # Sunbird cloud voice for Ugandan languages. Separate step from Gemini so
      # one provider being unconfigured never blocks the other from landing.
      - name: Sync Sunbird voice secrets to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ env.HF_SPACE }}
          SUNBIRD__API_TOKEN: ${{ secrets.SUNBIRD__API_TOKEN }}
          SUNBIRD__FALLBACK_API_TOKEN: ${{ secrets.SUNBIRD__FALLBACK_API_TOKEN }}
          SUNBIRD__ENABLED: ${{ vars.SUNBIRD__ENABLED }}
          SUNBIRD__USERNAME: ${{ secrets.SUNBIRD__USERNAME }}
          SUNBIRD__FALLBACK_USERNAME: ${{ secrets.SUNBIRD__FALLBACK_USERNAME }}
        run: |
          python3 - <<'PY'
          import os, sys
          from huggingface_hub import HfApi

          token = (os.environ.get("SUNBIRD__API_TOKEN") or "").strip()
          if not token:
              print("::notice::SUNBIRD__API_TOKEN not set — the Space keeps local-only "
                    "voice (whisper/piper), which is the pre-existing behaviour")
              sys.exit(0)

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]

          # The double underscore is pydantic-settings' nested delimiter; these
          # populate settings.sunbird.*, so the names must keep it.
          api.add_space_secret(repo_id=space, key="SUNBIRD__API_TOKEN", value=token)
          print("  set Space secret: SUNBIRD__API_TOKEN (***)")

          fallback = (os.environ.get("SUNBIRD__FALLBACK_API_TOKEN") or "").strip()
          if fallback:
              api.add_space_secret(
                  repo_id=space, key="SUNBIRD__FALLBACK_API_TOKEN", value=fallback
              )
              print("  set Space secret: SUNBIRD__FALLBACK_API_TOKEN (***)")
          else:
              # Failover needs two accounts. On one, a daily-quota 429 silently
              # drops Ugandan narration to an English voice with nothing to fall
              # back to, while is_available() stays true — so it reads as healthy.
              print("::warning::only one Sunbird account configured — set "
                    "SUNBIRD__FALLBACK_API_TOKEN so a quota 429 can fail over")

          # Not a secret: a variable stays visible and editable in the Space UI.
          # Defaults to "true" because a configured token that stays disabled is
          # a dead state nobody intends; set the repo variable to "false" to
          # stage the rollout.
          enabled = (os.environ.get("SUNBIRD__ENABLED") or "").strip() or "true"
          api.add_space_variable(repo_id=space, key="SUNBIRD__ENABLED", value=enabled)
          print(f"  set Space variable: SUNBIRD__ENABLED={enabled}")

          # Informational handles, so a log line can name which account served
          # or ran out of quota. Written as Space *secrets* rather than
          # variables: they are stored as repo secrets, and silently promoting
          # something the owner classified as secret into a UI-visible variable
          # is not this step's call to make.
          for var in ("SUNBIRD__USERNAME", "SUNBIRD__FALLBACK_USERNAME"):
              handle = (os.environ.get(var) or "").strip()
              if handle:
                  api.add_space_secret(repo_id=space, key=var, value=handle)
                  print(f"  set Space secret: {var} (***)")
          PY

      # A successful push only means git accepted the commit. The Space can still
      # land in CONFIG_ERROR (bad README front-matter) or NO_APP_FILE (missing
      # Dockerfile) and serve nothing, so the deploy is not considered done until
      # the runtime reaches RUNNING and /health actually answers. Both have
      # happened here; before this step the workflow reported success anyway.
      - name: Verify the Space builds and serves
        timeout-minutes: 30
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ env.HF_SPACE }}
        run: |
          python3 - <<'PY'
          import os, sys, time, urllib.request, json
          from huggingface_hub import HfApi

          space = os.environ["HF_SPACE"]
          token = os.environ.get("HF_TOKEN") or None
          api = HfApi()

          # owner/Name -> owner-name.hf.space
          host = space.replace("/", "-").replace("_", "-").lower()
          url = f"https://{host}.hf.space"

          TERMINAL_BAD = {"BUILD_ERROR", "CONFIG_ERROR", "RUNTIME_ERROR", "NO_APP_FILE", "DELETING"}
          deadline, last = time.time() + 25 * 60, None
          stage = None
          while time.time() < deadline:
              try:
                  stage = getattr(api.space_info(space, token=token).runtime, "stage", None)
              except Exception as e:
                  print(f"  space_info error (retrying): {type(e).__name__}")
                  time.sleep(20); continue
              if stage != last:
                  print(f"  stage: {stage}", flush=True); last = stage
              if stage == "RUNNING":
                  break
              if stage in TERMINAL_BAD:
                  print(f"::error::Space is in {stage}. Build logs: https://huggingface.co/spaces/{space}/logs")
                  sys.exit(1)
              time.sleep(20)
          else:
              print(f"::error::Space did not reach RUNNING within 25 min (last stage: {stage})")
              sys.exit(1)

          # RUNNING only means the container started; confirm the app answers.
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(f"{url}/health", timeout=30) as r:
                      body = r.read().decode()
                      if r.status == 200:
                          data = json.loads(body)
                          print(f"  /health -> 200 {data}")
                          if not data.get("model_loaded"):
                              print("::error::Space is up but model_loaded is false")
                              sys.exit(1)
                          print(f"::notice::Space live and healthy: {url}")
                          sys.exit(0)
              except Exception as e:
                  print(f"  attempt {attempt+1}/12: {type(e).__name__}")
              time.sleep(15)

          print(f"::error::Space reached RUNNING but {url}/health never answered")
          sys.exit(1)
          PY

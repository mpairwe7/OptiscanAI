# Prometheus configuration for RetinalAI observability stack.
# Scrapes metrics from the OTEL Collector's Prometheus exporter.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics

  - job_name: "retinalai-api"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /health
    scrape_interval: 30s

[project]
name = "optiscan-ai"
version = "2.0.0"
description = "Multi-label retinal disease classification with MLOps pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }

dependencies = [
    # Core ML
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "torchmetrics>=1.0.0",

    # Data
    "numpy<2.0,>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=9.5.0",
    "opencv-python-headless>=4.8.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "albumentations>=1.3.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",

    # Graph Neural Networks
    "torch-geometric>=2.3.0",
    "networkx>=3.1",

    # API Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0.0",

    # Subscription / billing platform
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.8.0",
    "email-validator>=2.1.0",
    "stripe>=10.0.0",
    "httpx>=0.27.0",

    # Config & Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "kagglehub>=0.3.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "psutil>=5.9.0",

    # Explainability
    "grad-cam>=1.5.2",
    "captum>=0.6.0",
    "lime>=0.2.0.1",
    "shap>=0.43.0",
    "eli5>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    # Pin black exactly — its default style bumps yearly. A floating range
    # silently reformats the tree on every install. CI workflows pin to the
    # same version. 25.12.0 matches uv.lock and avoids a pathspec conflict
    # with flwr (federated extra) that black 26.x triggers.
    "black==25.12.0",
    "ruff>=0.4.0",
    "mypy>=1.5.0",
    "ipykernel>=6.25.0",
]
deploy = []  # All runtime deps are in core dependencies (uvicorn, torch, etc.)
wandb = [
    "wandb>=0.17.0",
]
hpo = [
    "optuna>=3.6.0",
]

# Phase 1: Observability & MLOps
observability = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-logging>=0.45b0",
    "mlflow>=2.22.0",
]
drift-detection = [
    "nannyml>=0.12.0",
    "evidently>=0.6.0",
]

# Phase 2: Scalability & Security
ray-serve = [
    "ray[serve]>=2.40.0",
]
kafka = [
    "confluent-kafka>=2.3.0",
]
iceberg = [
    "pyiceberg>=0.7.0",
]
security = [
    "cryptography>=42.0.0",
    "tenacity>=8.2.0",
]

# Phase 3: Edge Deployment
edge = [
    "onnxruntime>=1.17.0",
    "onnx>=1.15.0",
]
coreml = [
    "coremltools>=7.0",
]

# Phase 2: Voice-First
voice = [
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.0",
    "resampy>=0.4.0",
]

# Phase 3: Uganda Ecosystem
uganda = [
    "aiohttp>=3.9.0",
    "reportlab>=4.0.0",
    "qrcode>=7.4.0",
    "pydicom>=2.4.0",
]

# Phase 4: Federated Learning
federated = [
    "flwr>=1.8.0",
    "opacus>=1.4.0",
]

# All production features combined
full = [
    "optiscan-ai[observability,drift-detection,ray-serve,kafka,iceberg,security,edge]",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "black==25.12.0",
    "pytest-asyncio>=1.3.0",
]
# Force a modern kaleido on Linux x86_64. uv's default resolution lands on
# `kaleido==0.2.1.post1` which only ships an `armv7l` wheel and fails on
# CI / typical dev hardware. 1.x has proper x86_64 wheels.
override-dependencies = [
    "kaleido>=1.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Re-export files: imports without uses are intentional public-API surface.
"**/__init__.py" = ["F401"]

# ML/scientific code conventions — `X`, `Y`, `X_train`, `nn`, `F`, etc. are
# standard PyTorch/sklearn naming. Ignoring N* lets researchers keep idiomatic
# names without burying them in noqa. E402 covers conditional imports after
# torch.cuda.is_available() probes and similar runtime guards.
"src/**/*.py" = ["N802", "N803", "N806", "N812", "N815", "N817", "E402"]

# Pipeline / training scripts are deliberately dense (multi-statement lines,
# sys.path insertions, conditional model imports). Style is owned by the
# script author; lint focuses on real bugs (F-rules) only.
"scripts/**/*.py" = [
    "E402", "E701", "E702", "E722",
    "N802", "N803", "N806", "N812", "N815", "N817",
]
"train.py" = ["E402", "N802", "N803", "N806", "N812", "N815", "N817"]

# Backend routers commonly do `if settings.feature_enabled: import heavy_dep`
# after the module preamble — keep E402 ignored at the router/core layer where
# this pattern is load-bearing.
"backend/app/main.py" = ["E402"]
"backend/app/routers/*.py" = ["E402"]
"backend/app/core/*.py" = ["E402"]

# DICOM integration probes pydicom and rebinds optional utilities under a
# try/except so missing extras don't crash the import.
"backend/app/integrations/dicom/handler.py" = ["F401"]
# model_card_generator gates a generator class on importing the dataclasses,
# which act as a feature flag for the optional `src.governance` module.
"backend/app/core/model_card_generator.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

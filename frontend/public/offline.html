<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Offline — OptiscanAI</title>
  <link rel="icon" href="/favicon-32x32.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      width: 100%;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 1px 2px rgba(15,23,42,.04);
    }
    .icon {
      width: 4rem; height: 4rem;
      margin: 0 auto 1rem;
      border-radius: 9999px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0d9488;
    }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
    p { margin: 0 0 1.5rem; color: #64748b; font-size: 0.9375rem; line-height: 1.5; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: .5rem; min-height: 44px; padding: 0 1.25rem;
      background: #0d9488; color: white; border: none; border-radius: .5rem;
      font-size: .875rem; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: #0f766e; }
    .btn:focus-visible { outline: 2px solid #0d9488; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; }
      .card { background: #1e293b; border-color: #334155; }
      p { color: #94a3b8; }
      .icon { background: #334155; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">
      <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M18.364 5.636A9 9 0 105.636 18.364M3 3l18 18" />
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>This page isn&rsquo;t available without a network connection. Reconnect and try again — your work won&rsquo;t be lost.</p>
    <button class="btn" onclick="location.reload()" type="button" aria-label="Retry loading the page">
      Try again
    </button>
  </main>
</body>
</html>
